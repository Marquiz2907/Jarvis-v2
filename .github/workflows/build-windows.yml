name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Create icon
        run: python scripts/make_icon.py

      - name: Build with PyInstaller
        run: python -m PyInstaller jarvis.spec --noconfirm --clean

      - name: Stage portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse dist/Jarvis release/Jarvis
          if (Test-Path .env.example) {
            Copy-Item .env.example release/Jarvis/.env.example
          } else {
            @'
          # Inserisci qui la chiave soltanto se usi Gemini.
          GEMINI_API_KEY=
          GEMINI_MODEL=gemini-2.5-flash
          JARVIS_BACKEND=gemini
          LMSTUDIO_BASE_URL=http://127.0.0.1:1234/v1
          LMSTUDIO_MODEL=
          JARVIS_LANGUAGE=it
          '@ | Set-Content -Path release/Jarvis/.env.example -Encoding utf8
          }
          if (Test-Path README.md) { Copy-Item README.md release/Jarvis/README.md }
          Compress-Archive -Path release/Jarvis -DestinationPath Jarvis-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: Jarvis-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis-windows.zip
          generate_release_notes: true
